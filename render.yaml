services:
  - type: web
    name: civicchain-backend
    env: node
    rootDir: backend
    buildCommand: npm install
    startCommand: node src/utils/seed.js && node src/server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: BLOCKCHAIN_MODE
        value: mock
      - key: FRONTEND_URL
        value: "*"
      - key: CLOUDINARY_URL
        sync: false

  - type: web
    name: civicchain-frontend
    env: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        value: https://civicchain-8b15.onrender.com/api
